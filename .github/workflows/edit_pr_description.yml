name: Remove html In PR description
on:
  # see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  pull-requests: write

jobs:
  remove_comment:
    name: Remove html comments.
    uses: napari/napari/.github/workflows/edit_pr_description.yml@2d4c9fadbaf86e819a1b565c4dce983a22baab94 # v0.8.0
