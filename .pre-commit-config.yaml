repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v6.0.0"
  hooks:
    - id: fix-byte-order-marker
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-yaml
    - id: check-json
    - id: debug-statements
    - id: end-of-file-fixer
    - id: mixed-line-ending
    - id: trailing-whitespace
      exclude: .*\.md

- repo: https://github.com/codespell-project/codespell
  # Configuration for codespell is in .codespellrc
  rev: v2.4.3
  hooks:
  - id: codespell

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [--fix]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: v0.2.77
  hooks:
    # Fix locally with: pre-commit run --hook-stage manual rumdl-fmt
    # additional_dependencies puts ruff on PATH for the code-block tools enabled in
    # .rumdl.toml. Keep this pin in step with the ruff-pre-commit rev above.
    - id: rumdl-check
      files: ^docs/
      additional_dependencies: [ruff==0.16.7]
    - id: rumdl-fmt
      files: ^docs/
      stages: [manual]
      additional_dependencies: [ruff==0.16.7]

default_language_version:
    python: python3.13
