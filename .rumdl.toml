# rumdl markdown linter and formatter
# https://github.com/rvben/rumdl
# very fast, written in rust

[global]
flavor = "myst"
respect-gitignore = true

# docs/release/release_*.md are generated by napari-release-tools'
exclude = ["docs/release/release_*.md"]

disable = [
  # --- false positives for a Sphinx/MyST site; permanent ---
  "MD057",   # MD057 treats relative links as filesystem paths, but Sphinx resolves [text](target) against the (label)= targets .
  "MD041",  # MD041 wants line 1 to be a level-1 heading; MyST files start with a (label)= target.

  # --- deferred: line length ---
  "MD013",
]


[per-file-ignores]
"docs/community/meeting_schedule.md" = ["MD033"]
"docs/developers/contributing/documentation/index.md" = ["MD034"]
"docs/naps/9-multiple-canvases.md" = ["MD058"]
"docs/plugins/building_a_plugin/best_practices.md" = ["MD032"]

[code-block-tools]
enabled = true
on-error = "warn"
on-missing-tool-binary = "fail"

[code-block-tools.languages]
# A formatter in the `lint` slot is a formatting check: `rumdl check` reports an
# unformatted block without rewriting it, and `rumdl fmt` rewrites it.
# MyST `{code-cell}` blocks are not covered: their info string is a directive
# rather than a language tag, so they are skipped.
python = { lint = ["ruff:format"], format = ["ruff:format"] }
