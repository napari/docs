# The napari checkout used by the `local` environment of the main workspace.
# From the repo root:
#   pixi run -e local slimfast
# To use another checkout (e.g. a worktree), change `path` below or run:
#   pixi run use-napari ../napari-my-branch
# Tasks live in the main pixi.toml; this workspace only provides the env.
# This is a separate workspace so the main one never needs napari on disk.
# (pixi solves every environment of a workspace, so a path dependency there
# would have to exist for everyone.)
[workspace]
channels = ["conda-forge"]
name = "napari-docs-local-napari"
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = "3.13.*"
make = "*"

[pypi-dependencies]
napari = { path = "../../napari", editable = true, extras = ["pyqt", "docs"] }
