
[workspace]
authors = ["napari developers"]
channels = ["conda-forge"]
name = "napari-docs"

platforms = ["win-64", "linux-64", "osx-arm64"]  # Mac Intel support is not available
version = "0.1.0"

[dependencies]
python = "3.13.*"
make = "*"

# default environment: napari main from GitHub
[feature.remote.pypi-dependencies]
napari = { git = "https://github.com/napari/napari.git", branch = "main", extras = ["pyqt", "docs"] }

[feature.remote.activation.env]
DOCS_MAKE = "make"

# local environment: run every task against a local napari checkout, e.g.
#   pixi run -e local slimfast-live
#   pixi run use-napari ../napari-my-branch   # switch checkout (relative to this repo)
# The checkout is installed in a separate workspace (local-napari/pixi.toml),
# because pixi solves every environment of a workspace, so a path dependency
# here would have to exist for everyone.
[feature.local.activation.env]
DOCS_MAKE = "pixi run -m local-napari make"

[feature.local.tasks]
use-napari = { cmd = "pixi add -m local-napari --pypi --editable \"napari[pyqt,docs] @ file:../{{ path }}\"", args = ["path"], description = "Point the local environment at a napari checkout, relative to this repo" }

[environments]
default = ["remote"]
local = ["local"]

# Tasks run in both environments. Use `$DOCS_MAKE` (not `make`) so that
# `-e local` builds against the local checkout, and keep
# `default-environment = "default"` so that `pixi run <task>` is not ambiguous.
[tasks]
# Clean tasks
clean = { cmd = "$DOCS_MAKE clean", default-environment = "default" }
clean-gallery = { cmd = "$DOCS_MAKE clean-gallery", default-environment = "default" }
clean-prep = { cmd = "$DOCS_MAKE clean-prep", default-environment = "default" }
clean-full = { cmd = "$DOCS_MAKE clean-full", default-environment = "default" }

# Preparation tasks
prep-docs = { cmd = "$DOCS_MAKE prep-docs", default-environment = "default" }
prep-stubs = { cmd = "$DOCS_MAKE prep-stubs", default-environment = "default" }

# Full builds
html = { cmd = "$DOCS_MAKE html", default-environment = "default" }
html-noplot = { cmd = "$DOCS_MAKE html-noplot", default-environment = "default" }
docs-build = { cmd = "$DOCS_MAKE docs-build", default-environment = "default" }

# Slim builds (no notebook execution, no gallery)
slim = { cmd = "$DOCS_MAKE slim", default-environment = "default" }
slimfast = { cmd = "$DOCS_MAKE slimfast", default-environment = "default" }

# Live builds (auto-rebuild on file changes)
html-noplot-live = { cmd = "$DOCS_MAKE html-noplot-live", default-environment = "default" }
docs-live = { cmd = "$DOCS_MAKE docs-live", default-environment = "default" }
slimfast-live = { cmd = "$DOCS_MAKE slimfast-live", default-environment = "default" }

# Gallery builds
slimgallery = { cmd = "$DOCS_MAKE slimgallery", default-environment = "default" }
slimgallery-live = { cmd = "$DOCS_MAKE slimgallery-live", default-environment = "default" }

# Utility tasks
linkcheck-files = { cmd = "$DOCS_MAKE linkcheck-files", default-environment = "default" }
spellcheck = { cmd = "$DOCS_MAKE spellcheck", default-environment = "default" }
