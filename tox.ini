# tox configuration for building the docs, an alternative to pixi.
#
# The docs environments run make with the given targets and arguments
# (`html` by default), e.g.:
#
#   tox -e docs -- slimfast
#   tox -e docs -- clean html SPHINXOPTS="-j 4"
#   tox -e remote-docs -- docs-live
#
# `docs` installs napari in editable mode from a local checkout, together with
# the `docs` dependency group from its pyproject.toml (tox reads dependency
# groups from package_root, which points at the checkout). By default the
# checkout is expected next to this repository (../napari); set NAPARI_PATH to
# use another location.
#
# `remote-docs` builds against napari main instead: it clones the repository
# into .tox/napari-main, updates it on every run and installs from it.

[tox]
requires =
    tox>=4.22
    tox-uv>=1.29
env_list = docs
package_root = {env:NAPARI_PATH:{toxinidir}{/}..{/}napari}

[testenv]
# matches CI and napari's docs constraints file, which is generated per version
base_python = python3.12
deps =
    # GNU Make, so the Makefile targets work without a system make
    gnumake
pass_env =
    DISPLAY
    WAYLAND_DISPLAY
    XAUTHORITY
    XDG_RUNTIME_DIR
    QT_*
    FILES
    EXAMPLE_NAME
commands =
    make {posargs:html}

[testenv:docs]
description = run make with the given targets (default: html) using local napari
package = editable
extras = pyqt
dependency_groups = docs
set_env =
    NAPARI_PATH = {env:NAPARI_PATH:{toxinidir}{/}..{/}napari}
    # passed to make; sphinx-gallery accepts an absolute path
    GALLERY_PATH = {env:NAPARI_PATH:{toxinidir}{/}..{/}napari}{/}examples
    # pin versions like CI does; tox-uv runs every install step through uv
    UV_CONSTRAINT = {env:NAPARI_PATH:{toxinidir}{/}..{/}napari}{/}resources{/}constraints{/}constraints_py{py_dot_ver}_docs.txt

[testenv:remote-docs]
description = run make with the given targets (default: html) using napari main
skip_install = true
set_env =
    NAPARI_PATH = {work_dir}{/}napari-main
    GALLERY_PATH = {work_dir}{/}napari-main{/}examples
allowlist_externals =
    git
# a partial clone keeps the tags, so setuptools-scm gives napari a real version;
# the clone fails harmlessly when it already exists, then fetch updates it.
# The explicit --git-dir stops git from searching parent directories: if the
# clone is broken, git would otherwise find the napari-docs repository and
# reset it to napari main. Checking the origin first stops the run instead.
# The constraints file comes from the clone, so it is passed to this install
# only; UV_CONSTRAINT would also apply to deps, installed before the clone.
commands_pre =
    - git clone --filter=blob:none https://github.com/napari/napari.git {env:NAPARI_PATH}
    git -C {env:NAPARI_PATH} --git-dir=.git remote get-url origin
    git -C {env:NAPARI_PATH} --git-dir=.git fetch --tags origin main
    git -C {env:NAPARI_PATH} --git-dir=.git reset --hard FETCH_HEAD
    uv pip install -e {env:NAPARI_PATH}[pyqt] --group {env:NAPARI_PATH}{/}pyproject.toml:docs \
        -c {env:NAPARI_PATH}{/}resources{/}constraints{/}constraints_py{py_dot_ver}_docs.txt

[testenv:spellcheck]
description = run codespell on all files
skip_install = true
deps =
    gnumake
    prek
commands =
    make spellcheck
